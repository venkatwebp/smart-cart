<section class="products-page">

  <h1>Products</h1>

  @if (products$ | async; as products) {

    @if (products.length === 0) {

      <p>No products found.</p>

    } @else {

      <div class="products-grid">

        @for (product of products; track product.id) {

          <app-product-card
            [product]="product">
          </app-product-card>

        }

      </div>

    }

  } @else {

    <p>Loading products...</p>

  }

</section>
