<div class="product-card">

  <div class="product-image">
    <img [src]="product.image" [alt]="product.title">
  </div>

  <div class="product-info">

    <span class="category">
      {{ product.category }}
    </span>

    <h3>{{ product.title }}</h3>

    <div class="rating">
      ⭐ {{ product.rating }}
    </div>

    <div class="price">
      ₹{{ product.price }}
    </div>

    <p
      class="stock"
      [class.out-of-stock]="!product.inStock">
      {{ product.inStock ? 'In Stock' : 'Out of Stock' }}
    </p>

    <div class="actions">

      <a
        [routerLink]="['/products', product.id]"
        class="details-btn">
        View Details
      </a>

      <button type="button" class="cart-btn" (click)="addToCart(product, 1)">
        Add to Cart
      </button>

      <button type="button" class="wishlist-btn">
        ♡
      </button>

    </div>

  </div>

</div>
